<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ДБЖ — Моніторинг системи безперебійного живлення</title>
  <style>
    :root {
      --color-normal: #27ae60;
      --color-warning: #f39c12;
      --color-danger: #e74c3c;
      --color-bg: #1a1a2e;
      --color-surface: #16213e;
      --color-card: #0f3460;
      --color-accent: #533483;
      --color-text: #eaeaea;
      --color-subtext: #aab4c2;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    /* ── HEADER ── */
    header {
      background: var(--color-surface);
      border-radius: var(--radius);
      padding: 28px 32px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-title h1 { font-size: 1.6rem; font-weight: 700; }
    .header-title p  { color: var(--color-subtext); font-size: 0.9rem; margin-top: 4px; }
    .header-time {
      text-align: right;
      font-size: 0.85rem;
      color: var(--color-subtext);
    }
    .header-time span { display: block; font-size: 1.1rem; color: var(--color-text); font-weight: 600; }

    /* ── MODE BADGE ── */
    .mode-bar {
      background: var(--color-surface);
      border-radius: var(--radius);
      padding: 16px 24px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: var(--shadow);
    }
    .mode-label { font-size: 0.85rem; color: var(--color-subtext); }
    .mode-badge {
      padding: 6px 18px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      transition: background 0.4s, color 0.4s;
    }
    .mode-network  { background: #1e4d2b; color: #4ade80; }
    .mode-battery  { background: #4a2c00; color: #fbbf24; }
    .mode-bypass   { background: #3a1a1a; color: #f87171; }

    /* ── CONTROLS ── */
    .controls {
      background: var(--color-surface);
      border-radius: var(--radius);
      padding: 16px 24px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: var(--shadow);
    }
    .btn {
      padding: 10px 22px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn:hover { opacity: 0.85; transform: translateY(-2px); }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-success { background: #22c55e; color: #fff; }
    .btn-danger  { background: #ef4444; color: #fff; }

    .auto-status {
      font-size: 0.85rem;
      color: var(--color-subtext);
      margin-left: 4px;
    }

    /* ── DASHBOARD ── */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--color-card);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.25s;
      position: relative;
      overflow: hidden;
    }
    .card:hover { transform: translateY(-4px); }
    .card-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-subtext);
    }
    .card-value {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .big-number { font-size: 2.8rem; font-weight: 800; line-height: 1; }
    .unit { font-size: 1rem; color: var(--color-subtext); }

    /* progress bar */
    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.6s ease, background 0.4s;
    }

    /* status dot */
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
    }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.4s;
    }
    .dot-normal  { background: var(--color-normal);  box-shadow: 0 0 6px var(--color-normal); }
    .dot-warning { background: var(--color-warning); box-shadow: 0 0 6px var(--color-warning); }
    .dot-danger  {
      background: var(--color-danger);
      box-shadow: 0 0 6px var(--color-danger);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── EXTRA PARAMS ── */
    .extras {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .extra-card {
      background: var(--color-surface);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .extra-card .card-title { margin-bottom: 6px; }
    .extra-value { font-size: 1.6rem; font-weight: 700; }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      header { flex-direction: column; align-items: flex-start; }
      .header-time { text-align: left; }
      .big-number { font-size: 2rem; }
      .controls { flex-direction: column; align-items: flex-start; }
      .btn { width: 100%; }
    }
    @media (min-width: 768px) and (max-width: 1024px) {
      .dashboard { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-title">
        <h1>🔋 Система безперебійного живлення</h1>
        <p>Моніторинг параметрів ДБЖ у реальному часі</p>
      </div>
      <div class="header-time">
        Останнє оновлення
        <span id="lastUpdate">--:--:--</span>
      </div>
    </header>

    <!-- Mode bar -->
    <div class="mode-bar" role="status" aria-live="polite">
      <span class="mode-label">Режим роботи:</span>
      <span id="modeBadge" class="mode-badge mode-network">🔌 МЕРЕЖА</span>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="updateBtn"     class="btn btn-primary" aria-label="Оновити дані вручну">🔄 Оновити</button>
      <button id="autoUpdateBtn" class="btn btn-success" aria-label="Увімкнути автооновлення">▶ Автооновлення</button>
      <span class="auto-status" id="autoStatus">Вимкнено</span>
    </div>

    <!-- Main parameter cards -->
    <main>
      <section class="dashboard" aria-label="Основні параметри">

        <!-- Напруга входу -->
        <div class="card">
          <div class="card-title">Напруга входу</div>
          <div class="card-value">
            <span id="param0" class="big-number">--</span>
            <span class="unit">В</span>
          </div>
          <div class="progress-track">
            <div id="bar0" class="progress-fill" style="width:0%"></div>
          </div>
          <div class="status-row">
            <div id="dot0" class="dot dot-normal"></div>
            <span id="statusText0">--</span>
          </div>
        </div>

        <!-- Напруга виходу -->
        <div class="card">
          <div class="card-title">Напруга виходу</div>
          <div class="card-value">
            <span id="param1" class="big-number">--</span>
            <span class="unit">В</span>
          </div>
          <div class="progress-track">
            <div id="bar1" class="progress-fill" style="width:0%"></div>
          </div>
          <div class="status-row">
            <div id="dot1" class="dot dot-normal"></div>
            <span id="statusText1">--</span>
          </div>
        </div>

        <!-- Навантаження -->
        <div class="card">
          <div class="card-title">Навантаження</div>
          <div class="card-value">
            <span id="param2" class="big-number">--</span>
            <span class="unit">%</span>
          </div>
          <div class="progress-track">
            <div id="bar2" class="progress-fill" style="width:0%"></div>
          </div>
          <div class="status-row">
            <div id="dot2" class="dot dot-normal"></div>
            <span id="statusText2">--</span>
          </div>
        </div>

        <!-- Заряд батареї -->
        <div class="card">
          <div class="card-title">Заряд батареї</div>
          <div class="card-value">
            <span id="param3" class="big-number">--</span>
            <span class="unit">%</span>
          </div>
          <div class="progress-track">
            <div id="bar3" class="progress-fill" style="width:0%"></div>
          </div>
          <div class="status-row">
            <div id="dot3" class="dot dot-normal"></div>
            <span id="statusText3">--</span>
          </div>
        </div>

      </section>

      <!-- Extra parameters -->
      <section class="extras" aria-label="Додаткові параметри">
        <div class="extra-card">
          <div class="card-title">Частота виходу</div>
          <div class="extra-value"><span id="freq">--</span> Гц</div>
        </div>
        <div class="extra-card">
          <div class="card-title">Температура системи</div>
          <div class="extra-value"><span id="temp">--</span> °C</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // ── CONFIG ──────────────────────────────────────────────────────
    const PARAMS = [
      { name: 'Напруга входу',  unit: 'В',  min: 180, max: 260, normal: [210, 240], dec: 1 },
      { name: 'Напруга виходу', unit: 'В',  min: 220, max: 230, normal: [223, 227], dec: 1 },
      { name: 'Навантаження',   unit: '%',  min: 0,   max: 100, normal: [30,   80], dec: 0 },
      { name: 'Заряд батареї',  unit: '%',  min: 0,   max: 100, normal: [90,  100], dec: 0 },
    ];

    const MODES = [
      { key: 'network', label: '🔌 МЕРЕЖА',  cls: 'mode-network' },
      { key: 'battery', label: '🔋 БАТАРЕЯ', cls: 'mode-battery' },
      { key: 'bypass',  label: '⚡ BYPASS',   cls: 'mode-bypass' },
    ];

    const STATUS_LABELS = { normal: 'Норма', warning: 'Попередження', danger: 'Критично' };
    const STATUS_COLORS = { normal: '#27ae60', warning: '#f39c12', danger: '#e74c3c' };

    let autoInterval = null;
    let isAutoEnabled = false;

    // ── HELPERS ─────────────────────────────────────────────────────
    function getRandom(min, max, dec) {
      return parseFloat((Math.random() * (max - min) + min).toFixed(dec));
    }

    function getStatus(value, param) {
      if (value >= param.normal[0] && value <= param.normal[1]) return 'normal';
      if (value >= param.min     && value <= param.max)         return 'warning';
      return 'danger';
    }

    function formatTime() {
      const now = new Date();
      return [now.getHours(), now.getMinutes(), now.getSeconds()]
        .map(n => String(n).padStart(2, '0')).join(':');
    }

    // ── UPDATE ──────────────────────────────────────────────────────
    function updateAll() {
      PARAMS.forEach((param, idx) => {
        const value  = getRandom(param.min, param.max, param.dec);
        const status = getStatus(value, param);
        const pct    = Math.round(((value - param.min) / (param.max - param.min)) * 100);

        document.getElementById('param' + idx).textContent = value;

        const bar = document.getElementById('bar' + idx);
        bar.style.width      = pct + '%';
        bar.style.background = STATUS_COLORS[status];

        const dot = document.getElementById('dot' + idx);
        dot.className = 'dot dot-' + status;

        document.getElementById('statusText' + idx).textContent = STATUS_LABELS[status];
      });

      // Extra params
      document.getElementById('freq').textContent = getRandom(49.5, 50.5, 2);
      document.getElementById('temp').textContent = getRandom(20, 55, 1);

      // Mode
      const modeObj   = MODES[Math.floor(Math.random() * MODES.length)];
      const modeBadge = document.getElementById('modeBadge');
      modeBadge.textContent = modeObj.label;
      modeBadge.className   = 'mode-badge ' + modeObj.cls;

      document.getElementById('lastUpdate').textContent = formatTime();
    }

    // ── AUTO UPDATE ─────────────────────────────────────────────────
    function toggleAuto() {
      const btn    = document.getElementById('autoUpdateBtn');
      const status = document.getElementById('autoStatus');
      if (!isAutoEnabled) {
        autoInterval   = setInterval(updateAll, 3000);
        isAutoEnabled  = true;
        btn.textContent = '⏸ Зупинити';
        btn.className   = 'btn btn-danger';
        status.textContent = 'Увімкнено (3 сек)';
      } else {
        clearInterval(autoInterval);
        isAutoEnabled  = false;
        btn.textContent = '▶ Автооновлення';
        btn.className   = 'btn btn-success';
        status.textContent = 'Вимкнено';
      }
    }

    // ── INIT ─────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      updateAll();
      document.getElementById('updateBtn').addEventListener('click', updateAll);
      document.getElementById('autoUpdateBtn').addEventListener('click', toggleAuto);
    });
  </script>
</body>
</html>
